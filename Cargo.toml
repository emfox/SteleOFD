[workspace]
resolver = "3"
members = [
    # Update this list whenever a crate is added.
    # L0 foundation: pure capability, no domain semantics
    "crates/steleofd-common",
    "crates/steleofd-error",
    "crates/steleofd-io",

    # L1 format: OFD national standard data model
    "crates/steleofd-model",
    "crates/steleofd-xml",
    "crates/steleofd-package",

    # L1.5 i18n: depended on by presentation only, never by the engine
    "crates/steleofd-i18n",

    # L2 engine: parsing, geometry, rendering, fonts
    "crates/steleofd-geometry",
    "crates/steleofd-font",
    "crates/steleofd-display",
    "crates/steleofd-parser",
    "crates/steleofd-render",

    # L3 capabilities: decoupled business capabilities
    "crates/steleofd-sign",
    "crates/steleofd-crypto",
    "crates/steleofd-convert",
    "crates/steleofd-edit",
    "crates/steleofd-search",
    "crates/steleofd-archive",
    "crates/steleofd-print",

    # L4 facade
    "crates/steleofd-core",

    # L5 adapters: one per delivery form
    "crates/steleofd-cli",
    "crates/steleofd-wasm",
    "crates/steleofd-ffi",
    "crates/steleofd-server",

    # L5 adapters: the native desktop reader
    "crates/steleofd-reader",

    # Testing support: fixtures shared by the suites, never released
    "crates/steleofd-testkit",

    # Fuzz targets: nightly only, and the crate wraps cargo-fuzz's own one
    "crates/steleofd-fuzz",
]
default-members = ["crates/steleofd-core", "crates/steleofd-cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
# The one place the minimum is stated; README and docs restate it. Verified by
# checking the workspace under this exact toolchain, not by trying to infer it.
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/emfox/SteleOFD"
readme = "README.md"
authors = ["OFD Team"]

[workspace.dependencies]
# Internal crates: paths declared once so each crate stays consistent
steleofd-common   = { path = "crates/steleofd-common",   version = "0.4.0" }
steleofd-error    = { path = "crates/steleofd-error",    version = "0.4.0" }
steleofd-io       = { path = "crates/steleofd-io",       version = "0.4.0" }
steleofd-model    = { path = "crates/steleofd-model",    version = "0.4.0" }
steleofd-xml      = { path = "crates/steleofd-xml",      version = "0.4.0" }
steleofd-package  = { path = "crates/steleofd-package",  version = "0.4.0" }
steleofd-i18n     = { path = "crates/steleofd-i18n",     version = "0.4.0" }
steleofd-geometry = { path = "crates/steleofd-geometry", version = "0.4.0" }
steleofd-font     = { path = "crates/steleofd-font",     version = "0.4.0" }
steleofd-display  = { path = "crates/steleofd-display",  version = "0.4.0" }
steleofd-parser   = { path = "crates/steleofd-parser",   version = "0.4.0" }
steleofd-render   = { path = "crates/steleofd-render",   version = "0.4.0" }
steleofd-sign     = { path = "crates/steleofd-sign",     version = "0.4.0" }
steleofd-crypto   = { path = "crates/steleofd-crypto",   version = "0.4.0" }
steleofd-convert  = { path = "crates/steleofd-convert",  version = "0.4.0", default-features = false }
steleofd-edit     = { path = "crates/steleofd-edit",     version = "0.4.0" }
steleofd-search   = { path = "crates/steleofd-search",   version = "0.4.0" }
steleofd-archive  = { path = "crates/steleofd-archive",  version = "0.4.0" }
steleofd-print    = { path = "crates/steleofd-print",    version = "0.4.0" }
steleofd-core     = { path = "crates/steleofd-core",     version = "0.4.0" }
steleofd-testkit  = { path = "crates/steleofd-testkit",  version = "0.4.0" }

# External dependencies: versions pinned in one place
zip        = { version = "9", default-features = false, features = ["deflate", "deflate64", "time"] }
quick-xml  = { version = "0.42", features = ["serialize"] }
serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"
tracing    = "0.1"
# eframe's browser logger writes through `log`, which the reader uses on wasm.
log        = "0.4"
bitflags   = "2"
uuid       = { version = "1", features = ["v4", "serde"] }

# Internationalization (Fluent)
fluent      = "0.16"
fluent-bundle = "0.15"
fluent-langneg = "0.13"
unic-langid = { version = "0.9", features = ["macros"] }
icu_datetime = { version = "2", default-features = false, features = ["compiled_data"] }
icu_decimal  = { version = "2", default-features = false, features = ["compiled_data"] }

# Graphics and rendering
tiny-skia  = "0.11"
kurbo      = { version = "0.12", features = ["serde"] }
skrifa     = "0.48"
fontdue    = "0.9"
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif"] }

# JBIG2 for scanned pages. The `simd` feature is off on purpose: it pulls in
# fearless_simd, and every backend here is `#![forbid(unsafe_code)]`.
hayro-jbig2 = { version = "0.3", default-features = false }

# PDF interop
pdf        = { version = "0.10", default-features = false }
lopdf      = { version = "0.45", default-features = false }

# Chinese national cryptography
cipher     = "0.5"
ecb        = "0.2"
cbc        = "0.2"
sm2        = { version = "0.14", features = ["arithmetic", "dsa", "pem", "getrandom"] }
signature  = "3"
getrandom  = "0.3"
sm3        = "0.5"
sm4        = "0.6"
x509-parser = "0.18"
der        = { version = "0.8", features = ["alloc", "oid"] }

# Concurrency and runtime, behind the server feature
tokio      = { version = "1", features = ["full"] }
rayon      = "1.11"
axum       = "0.8"

# Desktop GUI for the native reader. Pinned below 0.36, which needs Rust 1.95.
egui = "0.35"
eframe = { version = "0.35", default-features = false }

# Platform integration
wasm-bindgen       = "0.2"
wasm-bindgen-futures = "0.4"
js-sys             = "0.3"
web-sys            = "0.3"

# Development and testing
proptest   = "1"
criterion  = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1"

# The semver policy lives here and is read only by a crate that opts in with
# `[package.metadata.cargo-semver-checks.lints] workspace = true`, because the
# tool has no file of its own and no default opt-in. A field added to a public
# struct breaks a literal a caller wrote, so it costs a minor release like a
# new enum variant; everything else still needs a major one.
[workspace.metadata.cargo-semver-checks.lints]
enum_variant_added = { required-update = "minor" }
constructible_struct_adds_field = { required-update = "minor" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = true
