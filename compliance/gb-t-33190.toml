# Conformance register for GB/T 33190-2016.
#
# One entry per normative clause. `status` drives the gate:
#   verified  - at least one linked test asserts the clause
#   partial   - partially asserted, needs more tests
#   untested  - known clause, no coverage yet
#   deviation - deliberately not followed; reason in `note`
#
# Test names follow `gb_t_33190_<clause>_<slug>` and are collected by
# scripts/check_compliance.py, which also regenerates docs/COMPLIANCE.md.

standard = "GB/T 33190-2016"
