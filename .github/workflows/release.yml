name: Release

# Publishing is triggered by pushing a version tag, so the artefacts and the tag
# can never disagree about what was built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One desktop build per system. Windows is cross-compiled from Ubuntu with
  # mingw-w64, the same way it is built and tested locally, so the toolchain
  # comes from apt rather than a Chocolatey install on a Windows runner.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            target: ""
            compile: ""
          - os: ubuntu-latest
            name: windows
            # The GNU target, not MSVC: the result runs without a matching
            # Visual C++ redistributable on the machine that downloads it.
            target: x86_64-pc-windows-gnu
            compile: mingw
          - os: macos-latest
            name: macos
            target: ""
            compile: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # font-kit needs fontconfig headers to build its sys crate. The Windows
      # build compiles on Linux too, so it takes the same Linux headers.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev pkg-config
          if [ "${{ matrix.compile }}" = mingw ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64
          fi
      - name: Install system dependencies
        if: runner.os == 'macOS'
        run: brew install fontconfig pkg-config

      # Dependencies only, not the whole `target/`: caching every artefact made
      # a multi-gigabyte blob whose restore cost more than the build it saved.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-reader-${{ matrix.name }}

      # The cross build names the linker the `*-windows-gnu` target cannot find
      # on its own; a native build only states the target it already is.
      - name: Build the reader
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p sofd-reader --target "${{ matrix.target }}"
          else
            cargo build --release -p sofd-reader
          fi

      - name: Collect the executable
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            linux)   cp target/release/sofd-reader dist/sofd-reader-linux ;;
            windows) cp target/x86_64-pc-windows-gnu/release/sofd-reader.exe dist/sofd-reader-windows.exe ;;
            macos)   cp target/release/sofd-reader dist/sofd-reader-macos ;;
          esac
          ls -la dist

      # The builds are unsigned, so the checksum is the only thing a
      # downloader can hold a binary to. Each job names its own manifest
      # because a same-named asset replaces rather than merges, and the job
      # at the foot of this file merges them once every upload has landed.
      - name: Checksum the executable
        run: python3 scripts/release_checksums.py generate dist --sums SHA256SUMS.${{ matrix.name }}

      - name: Attach the executable to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sofd-reader-*
            dist/SHA256SUMS.${{ matrix.name }}

  # The same reader, built for the browser. It is a separate job because its
  # output is a page rather than an executable: `wasm-bindgen` writes the module
  # and the glue, and `web/` supplies the canvas they draw into.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-web

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen

      # The page's entry point lives in the binary crate, beside the frame it
      # wraps, so the binary is what `wasm-bindgen` turns into the module.
      - name: Build the reader for the browser
        run: |
          cargo build --release --target wasm32-unknown-unknown -p sofd-reader
          wasm-bindgen --target web --out-name sofd_reader --no-typescript \
            --out-dir crates/sofd-reader/pkg \
            target/wasm32-unknown-unknown/release/sofd-reader.wasm

      - name: Collect the page
        run: |
          mkdir -p dist
          cp -r crates/sofd-reader/web dist/web
          cp -r crates/sofd-reader/pkg dist/web/pkg
          # The page imports the module by a relative path, so the directory
          # can be served from anywhere, including straight off a disk.
          cat > dist/web/serve.txt <<'EOF'
          Serve this directory over HTTP; a browser will not load the module
          from a file:// URL. Any static server works, for example:

              python3 -m http.server --directory web 8080
          EOF
          ls -la dist/web

      - name: Package the page
        run: |
          cd dist
          zip -qr sofd-reader-web.zip web
          ls -la

      - name: Checksum the page
        run: python3 scripts/release_checksums.py generate dist --sums SHA256SUMS.web

      - name: Attach the page to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sofd-reader-web.zip
            dist/SHA256SUMS.web

  # Android needs a native library the activity can load, and an archive the
  # system can install. The SDK and NDK are fetched here; the archive is put
  # together by a script, so no Gradle project is committed for three files.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android

      - name: Install the Android SDK tools
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # The NDK is the compiler and linker this target needs; the platform
          # is the android.jar the activity is compiled against.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build the native library
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # A cdylib rather than the binary: the activity loads the symbol
          # table through System.loadLibrary, and only a library exports one.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang" \
            cargo build --release --lib -p sofd-reader --target aarch64-linux-android

      - name: Assemble the package
        run: |
          python3 scripts/android_package.py \
            --sdk "$ANDROID_HOME" \
            --lib target/aarch64-linux-android/release/libsofd_reader.so \
            --out dist

      - name: Checksum the package
        run: python3 scripts/release_checksums.py generate dist --sums SHA256SUMS.android

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sofd-reader-android.apk
            dist/SHA256SUMS.android

  # The libraries other programs link against, and the browser bindings of the
  # engine itself. These are the same on every desktop system, so one build.
  artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      # Dependencies only, for the same reason the desktop job above states.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-artefacts

      - name: Build the C ABI library
        run: cargo build --release -p sofd-ffi

      # The header is generated by cbindgen into the crate, so a release that
      # shipped an out-of-date header would be caught here.
      - name: Check the generated C header is current
        run: git diff --exit-code crates/sofd-ffi/include/sofd.h

      # The notes are read here because this job is the only one that always
      # runs: read them in a job a matrix can skip, and the release ships empty.
      - name: Read the release notes from the changelog
        run: |
          mkdir -p dist
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build the WebAssembly bindings
        run: wasm-pack build crates/sofd-wasm --release --target web

      - name: Collect the artefacts
        run: |
          mkdir -p dist
          cp target/release/libsofd_ffi.so dist/ || true
          cp target/release/libsofd_ffi.a dist/ || true
          cp crates/sofd-ffi/include/sofd.h dist/
          cp crates/sofd-wasm/pkg/*.js dist/ 2>/dev/null || true
          cp crates/sofd-wasm/pkg/*.wasm dist/ 2>/dev/null || true
          cp crates/sofd-wasm/pkg/*.d.ts dist/ 2>/dev/null || true
          ls -la dist

      # Same reason as the desktop job: no signing key ships with a release, so
      # every artefact is published beside the digest that identifies it.
      - name: Checksum the artefacts
        run: python3 scripts/release_checksums.py generate dist --sums SHA256SUMS.artefacts

      - name: Attach the artefacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/libsofd_ffi.*
            dist/sofd.h
            dist/*.js
            dist/*.wasm
            dist/*.d.ts
            dist/SHA256SUMS.artefacts
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false

  # UOS Desktop V20 ships glibc 2.28 and nothing newer, so a reader built on a
  # current runner installs and then refuses to start. The build therefore
  # happens inside Debian 10, whose glibc is that same 2.28, and the package is
  # proven by installing it into a Deepin 20 container, the desktop UOS is
  # built from.
  uos:
    runs-on: ubuntu-latest
    container:
      image: debian:buster
    steps:
      - uses: actions/checkout@v4

      # Debian 10 is EOL and its packages moved to the archive, so the ordinary
      # mirrors no longer answer and apt needs to be told not to date-check.
      - name: Point apt at the archive
        run: |
          rm -f /etc/apt/sources.list.d/*.list
          printf 'deb http://archive.debian.org/debian buster main\ndeb http://archive.debian.org/debian-security buster/updates main\n' > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Check-Date=false update -qq
          # python3 is not in a Debian 10 base image, and the step that turns
          # the build into a `.deb` is written in it.
          apt-get install -y -qq --no-install-recommends \
            curl ca-certificates build-essential pkg-config git python3 \
            libfontconfig1-dev libfreetype6-dev

      - name: Install toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-uos

      - name: Build the reader
        run: cargo build --release -p sofd-reader

      # The package is the only thing published, and it must be one a glibc
      # 2.28 system can run; the check fails here rather than at the user.
      - name: Assemble the package
        run: |
          python3 scripts/uos_package.py \
            --binary target/release/sofd-reader \
            --version "${GITHUB_REF_NAME#v}" \
            --out dist \
            --check-glibc

      - name: Checksum the package
        run: python3 scripts/release_checksums.py generate dist --sums SHA256SUMS.uos

      # The archive is named for the architecture it was built for, so it is
      # matched by pattern rather than by a name the script would have to keep.
      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sofd-reader-uos-*.deb
            dist/SHA256SUMS.uos

  # A release asset is replaced, never merged, by an upload of the same name.
  # So the jobs above publish one manifest each and this one gathers them into
  # the `SHA256SUMS` a downloader expects, then removes the parts.
  checksums:
    needs: [desktop, web, android, uos, artefacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gather the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist --pattern 'SHA256SUMS.*'
          # A re-run finds the parts already merged and removed by the last
          # one, so the manifest that is there is the whole of it.
          if compgen -G 'dist/SHA256SUMS.*' > /dev/null; then
            cat dist/SHA256SUMS.* | sort -k2 > dist/SHA256SUMS
          else
            gh release download "$GITHUB_REF_NAME" --dir dist --pattern 'SHA256SUMS' --clobber
          fi
          wc -l dist/SHA256SUMS

      # The merged file is checked against the assets themselves before it is
      # published, so a manifest that could not be verified never ships.
      - name: Check the manifest against the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf assets
          gh release download "$GITHUB_REF_NAME" --dir assets --clobber \
            --pattern 'sofd-*' --pattern 'libsofd_ffi.*' \
            --pattern 'sofd_*' --pattern 'sofd.h'
          cp dist/SHA256SUMS assets/
          python3 scripts/release_checksums.py verify assets

      - name: Attach the manifest and drop the parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --clobber
          if compgen -G 'dist/SHA256SUMS.*' > /dev/null; then
            for part in dist/SHA256SUMS.*; do
              gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$part")" --yes
            done
          fi
