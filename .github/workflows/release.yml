name: Release

# Publishing is triggered by pushing a version tag, so the artefacts and the tag
# can never disagree about what was built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop reader is the one artefact a person can actually use, so it is
  # built for all three desktop systems from one job per system. Windows and
  # macOS builders have their fontconfig story solved differently on Linux, so
  # the dependency step is not shared.
  reader:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      # font-kit needs fontconfig headers to build its sys crate; Linux calls
      # them fontconfig, macOS and Windows builders use the same headers but the
      # vcpkg toolchain the Windows one reaches them through.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - name: Install system dependencies
        if: runner.os == 'macOS'
        run: brew install fontconfig pkg-config
      - name: Install system dependencies
        if: runner.os == 'Windows'
        run: choco install -y pkgconfiglite

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-reader-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-reader-

      - name: Build the reader
        run: cargo build --release -p steleofd-reader

      - name: Collect the executable
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Linux)   cp target/release/steleofd-reader dist/steleofd-reader-linux ;;
            Windows) cp target/release/steleofd-reader.exe dist/steleofd-reader-windows.exe ;;
            macOS)   cp target/release/steleofd-reader dist/steleofd-reader-macos ;;
          esac
          ls -la dist

      - name: Attach the executable to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/steleofd-reader-*

  artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Build the C ABI library
        run: cargo build --release -p steleofd-ffi

      # The header is generated by cbindgen into the crate, so a release that
      # shipped an out-of-date header would be caught here.
      - name: Check the generated C header is current
        run: git diff --exit-code crates/steleofd-ffi/include/steleofd.h

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build the WebAssembly bindings
        run: wasm-pack build crates/steleofd-wasm --release --target web

      - name: Collect the artefacts
        run: |
          mkdir -p dist
          cp target/release/libsteleofd_ffi.so dist/ || true
          cp target/release/libsteleofd_ffi.a dist/ || true
          cp crates/steleofd-ffi/include/steleofd.h dist/
          cp crates/steleofd-wasm/pkg/*.js dist/ 2>/dev/null || true
          cp crates/steleofd-wasm/pkg/*.wasm dist/ 2>/dev/null || true
          cp crates/steleofd-wasm/pkg/*.d.ts dist/ 2>/dev/null || true
          ls -la dist

      # The tag names the release, and the changelog carries the notes, so the
      # archive contents and the published notes come from the same commit.
      - name: Attach the artefacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
