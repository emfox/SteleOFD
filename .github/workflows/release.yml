name: Release

# Publishing is triggered by pushing a version tag, so the artefacts and the tag
# can never disagree about what was built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop reader is the one artefact a person can actually use, so it is
  # built once per desktop system. The three do not share a dependency step:
  # fontconfig arrives through the system package manager on Linux, through
  # Homebrew on macOS and through MSYS2's pkg-config on Windows.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            target: ""
          - os: windows-latest
            name: windows
            # The GNU target, not MSVC: the result runs without a matching
            # Visual C++ redistributable on the machine that downloads it.
            target: x86_64-pc-windows-gnu
          - os: macos-latest
            name: macos
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # font-kit needs fontconfig headers to build its sys crate; Linux calls
      # them fontconfig, macOS and Windows builders use the same headers but the
      # vcpkg toolchain the Windows one reaches them through.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config
      - name: Install system dependencies
        if: runner.os == 'macOS'
        run: brew install fontconfig pkg-config
      # mingw-w64 supplies the GNU linker and runtime the `*-windows-gnu`
      # target links against; pkg-config finds the fontconfig headers the
      # MSYS2 environment ships for the GNU toolchain.
      - name: Install system dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y mingw
          echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"

      # Dependencies only, not the whole `target/`: caching every artefact made
      # a multi-gigabyte blob whose restore cost more than the build it saved.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-reader

      - name: Build the reader
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p steleofd-reader --target "${{ matrix.target }}"
          else
            cargo build --release -p steleofd-reader
          fi

      - name: Collect the executable
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.os }}" in
            ubuntu-latest)  cp target/release/steleofd-reader dist/steleofd-reader-linux ;;
            windows-latest) cp target/x86_64-pc-windows-gnu/release/steleofd-reader.exe dist/steleofd-reader-windows.exe ;;
            macos-latest)   cp target/release/steleofd-reader dist/steleofd-reader-macos ;;
          esac
          ls -la dist

      # The builds are unsigned, so the checksum is the only thing a
      # downloader can hold a binary to. It is generated here, next to the
      # bytes, so it can never describe a file the tag did not build.
      - name: Checksum the executable
        run: python3 scripts/release_checksums.py generate dist

      - name: Attach the executable to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steleofd-reader-*
            dist/SHA256SUMS

  # The same reader, built for the browser. It is a separate job because its
  # output is a page rather than an executable: `wasm-bindgen` writes the module
  # and the glue, and `web/` supplies the canvas they draw into.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-web

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen

      # The page's entry point lives in the binary crate, beside the frame it
      # wraps, so the binary is what `wasm-bindgen` turns into the module.
      - name: Build the reader for the browser
        run: |
          cargo build --release --target wasm32-unknown-unknown -p steleofd-reader
          wasm-bindgen --target web --out-name steleofd_reader --no-typescript \
            --out-dir crates/steleofd-reader/pkg \
            target/wasm32-unknown-unknown/release/steleofd-reader.wasm

      - name: Collect the page
        run: |
          mkdir -p dist
          cp -r crates/steleofd-reader/web dist/web
          cp -r crates/steleofd-reader/pkg dist/web/pkg
          # The page imports the module by a relative path, so the directory
          # can be served from anywhere, including straight off a disk.
          cat > dist/web/serve.txt <<'EOF'
          Serve this directory over HTTP; a browser will not load the module
          from a file:// URL. Any static server works, for example:

              python3 -m http.server --directory web 8080
          EOF
          ls -la dist/web

      - name: Package the page
        run: |
          cd dist
          zip -qr steleofd-reader-web.zip web
          ls -la

      - name: Checksum the page
        run: python3 scripts/release_checksums.py generate dist

      - name: Attach the page to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steleofd-reader-web.zip
            dist/SHA256SUMS

  # Android needs a native library the activity can load, and an archive the
  # system can install. The SDK and NDK are fetched here; the archive is put
  # together by a script, so no Gradle project is committed for three files.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android

      - name: Install the Android SDK tools
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # The NDK is the compiler and linker this target needs; the platform
          # is the android.jar the activity is compiled against.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build the native library
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # A cdylib rather than the binary: the activity loads the symbol
          # table through System.loadLibrary, and only a library exports one.
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang" \
            cargo build --release --lib -p steleofd-reader --target aarch64-linux-android

      - name: Assemble the package
        run: |
          python3 scripts/android_package.py \
            --sdk "$ANDROID_HOME" \
            --lib target/aarch64-linux-android/release/libsteleofd_reader.so \
            --out dist

      - name: Checksum the package
        run: python3 scripts/release_checksums.py generate dist

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/steleofd-reader-android.apk
            dist/SHA256SUMS

  # The libraries other programs link against, and the browser bindings of the
  # engine itself. These are the same on every desktop system, so one build.
  artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      # Dependencies only, for the same reason the desktop job above states.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-artefacts

      - name: Build the C ABI library
        run: cargo build --release -p steleofd-ffi

      # The header is generated by cbindgen into the crate, so a release that
      # shipped an out-of-date header would be caught here.
      - name: Check the generated C header is current
        run: git diff --exit-code crates/steleofd-ffi/include/steleofd.h

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build the WebAssembly bindings
        run: wasm-pack build crates/steleofd-wasm --release --target web

      - name: Collect the artefacts
        run: |
          mkdir -p dist
          cp target/release/libsteleofd_ffi.so dist/ || true
          cp target/release/libsteleofd_ffi.a dist/ || true
          cp crates/steleofd-ffi/include/steleofd.h dist/
          cp crates/steleofd-wasm/pkg/*.js dist/ 2>/dev/null || true
          cp crates/steleofd-wasm/pkg/*.wasm dist/ 2>/dev/null || true
          cp crates/steleofd-wasm/pkg/*.d.ts dist/ 2>/dev/null || true
          ls -la dist

      # Same reason as the desktop job: no signing key ships with a release, so
      # every artefact is published beside the digest that identifies it.
      - name: Checksum the artefacts
        run: python3 scripts/release_checksums.py generate dist

      # The tag names the release, and the changelog carries the notes, so the
      # archive contents and the published notes come from the same commit.
      # The manifest is not attached: each job above already uploaded one for
      # the files it built, and an asset of the same name is replaced rather
      # than merged, which would leave the rest of them unlisted.
      - name: Attach the artefacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/libsteleofd_ffi.*
            dist/steleofd.h
            dist/*.js
            dist/*.wasm
            dist/*.d.ts
          generate_release_notes: true
