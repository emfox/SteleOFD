name: CI

on:
  push:
    branches: [main]
    # A docs-only or licence-only commit has nothing for the Rust gate to say,
    # and the gate is the expensive part of a push.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `stable`: a rolling toolchain turns every new lint
      # upstream ships into a red build nobody asked for. Raising the version
      # here is a deliberate commit, and it is the one the sandbox can match.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      # `Swatinem/rust-cache` caches the registry and the *dependency* artefacts
      # rather than the whole `target/`. Caching all of `target/` made a single
      # 7.8 GB blob that every job restored in ~140 s — longer than the build it
      # replaced. This key is also per-job, so the six jobs stop contending for
      # one entry.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` is passed to clippy rather than through RUSTFLAGS, which
      # would apply to every dependency too and let someone else's crate fail
      # this build. Only this workspace's code is held to the standard.
      - name: Clippy
        env:
          RUSTFLAGS: ""
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log
          status=$?
          # Surface each finding as an annotation, so it is readable on the
          # commit rather than only in a log nobody opens. A clean run leaves
          # grep with nothing to match, which must not fail the step.
          grep -E ': (warning|error)' clippy.log | head -20 \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          exit $status

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Test with every feature on
        run: cargo test --workspace --all-features

      # The pixels, not the ops: `cargo test` runs this too, but naming it here
      # keeps a rendering regression readable on the run page rather than buried
      # in the suite. A reference that needs updating is a deliberate commit.
      - name: Golden images
        run: cargo test -p steleofd-convert --test golden

      # The reader's window is a real widget tree, so this drives it without a
      # display and without an X server: labels come from the catalogue and
      # clicks reach `App`. Without this step the layout could rot while the
      # engine keeps passing.
      - name: Reader window, driven headlessly
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          cargo test -p steleofd-reader --test window

      - name: Message catalogues
        run: python3 scripts/check_i18n.py --strict

      - name: Language policy
        run: python3 scripts/check_language.py

      - name: Release checksums round-trip
        run: python3 scripts/release_checksums.py selftest
      - name: GB/T 33190 conformance register
        run: python3 scripts/check_compliance.py --check-only

      - name: Compliance matrix is current
        run: |
          python3 scripts/check_compliance.py
          git diff --exit-code docs/COMPLIANCE.md

      - name: Committed corpus archives match their sources
        run: python3 scripts/pack_corpus.py --check

      - name: Corpus validates against annex A schemas
        run: |
          python3 -m pip install --quiet lxml
          python3 scripts/validate_ofd.py --allow-foreign \
            $(find compliance/corpus -name '*.ofd' -o -name '*.xml' | sort)

  # The second-implementation corpus is fetched, not committed, so CI cannot
  # assume it is there. This runs the same job locally does, which is the point:
  # the parse bugs it found were all hard errors that no committed fixture hit.
  third-party-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: corpus

      - name: Fetch the samples
        run: python3 scripts/fetch_corpus.py

      - name: Every pinned sample is present
        run: python3 scripts/fetch_corpus.py --check

      # Not every sample opens: two of them do not, and the reason each does not
      # is recorded in the script. What CI holds is the set, so a sample that
      # breaks for a new reason fails here and one that starts working says so.
      - name: The samples that do not open are still the known ones
        run: python3 scripts/fetch_corpus.py --parse

      # The standard's own conformance set, one document per clause. It shares
      # this job because it is fetched the same way and needs the same build.
      - name: Fetch the clause samples
        run: python3 scripts/fetch_gb_samples.py

      - name: Every clause sample is present
        run: python3 scripts/fetch_gb_samples.py --check

      - name: Every clause sample still opens
        run: python3 scripts/fetch_gb_samples.py --parse

  # The budget in docs/PERFORMANCE.md, enforced. It runs the benchmarks and
  # checks each one-page figure against its ceiling, which is set well above
  # the baseline: only a change that makes a page cost several times what it
  # did crosses it. Ordinary noise and different hardware do not.
  #
  # It does not run for a docs-only or config-only commit: the workflow's
  # `paths-ignore` already drops those before any job is created, and a commit
  # that touches Rust and docs together still runs it, because the Rust half
  # could move a benchmark.
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf

      # Only the budgeted targets: running every benchmark would spend a
      # runner's afternoon on numbers nothing gates on.
      - name: Run the budgeted benchmarks
        run: |
          cargo bench -p steleofd-parser --bench parse
          cargo bench -p steleofd-convert --bench convert

      - name: Every benchmarked stage is within budget
        run: python3 scripts/check_performance.py

  fuzz:
    runs-on: ubuntu-latest
    # A short, deterministic smoke run: enough to catch a crash on the seeds
    # and a handful of mutations without spending a runner's afternoon. The
    # real campaign runs locally with `cargo +nightly fuzz run <target>`.
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz the ZIP reader
        run: cargo +nightly fuzz run package_open -- -runs=20000 -max_len=4096

      - name: Fuzz the XML cursor
        run: cargo +nightly fuzz run xml_cursor -- -runs=20000 -max_len=4096

  semver:
    runs-on: ubuntu-latest
    # A breaking public-API change should fail here rather than surprise a
    # downstream user. Until the first release the crates are unpublished, so
    # there is no baseline to compare against; the job is a no-op then rather
    # than a false alarm, and starts checking from the first `v*` tag onwards.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Find the latest release tag
        id: baseline
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No release tag yet, so there is no published API to protect."
          else
            echo "Comparing against $tag"
          fi

      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.tag != ''
        run: cargo install cargo-semver-checks --locked

      - name: Check the public API against the last release
        if: steps.baseline.outputs.tag != ''
        run: cargo semver-checks check-release --baseline-rev ${{ steps.baseline.outputs.tag }}

  coverage:
    runs-on: ubuntu-latest
    # A gate, with the floor set well under the measured baseline (87.56% lines)
    # so ordinary work never trips it while losing a module's tests does.
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain with the coverage runtime
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: llvm-tools-preview

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure line coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Summarize into the run page
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail below the floor
        run: cargo llvm-cov report --fail-under-lines 85

      - name: Keep the report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
