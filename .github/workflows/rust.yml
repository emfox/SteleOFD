name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Test with every feature on
        run: cargo test --workspace --all-features

      # The reader's window is a real widget tree, so this drives it without a
      # display and without an X server: labels come from the catalogue and
      # clicks reach `App`. Without this step the layout could rot while the
      # engine keeps passing.
      - name: Reader window, driven headlessly
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          cargo test -p steleofd-reader --test window

      - name: Message catalogues
        run: python3 scripts/check_i18n.py --strict

      - name: Language policy
        run: python3 scripts/check_language.py

      - name: GB/T 33190 conformance register
        run: python3 scripts/check_compliance.py --check-only

      - name: Compliance matrix is current
        run: |
          python3 scripts/check_compliance.py
          git diff --exit-code docs/COMPLIANCE.md

      - name: Committed corpus archives match their sources
        run: python3 scripts/pack_corpus.py --check

      - name: Corpus validates against annex A schemas
        run: |
          python3 -m pip install --quiet lxml
          python3 scripts/validate_ofd.py --allow-foreign \
            $(find compliance/corpus -name '*.ofd' -o -name '*.xml' | sort)

  fuzz:
    runs-on: ubuntu-latest
    # A short, deterministic smoke run: enough to catch a crash on the seeds
    # and a handful of mutations without spending a runner's afternoon. The
    # real campaign runs locally with `cargo +nightly fuzz run <target>`.
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz the ZIP reader
        run: cargo +nightly fuzz run package_open -- -runs=20000 -max_len=4096

      - name: Fuzz the XML cursor
        run: cargo +nightly fuzz run xml_cursor -- -runs=20000 -max_len=4096

  semver:
    runs-on: ubuntu-latest
    # A breaking public-API change should fail here rather than surprise a
    # downstream user. Until the first release the crates are unpublished, so
    # there is no baseline to compare against; the job is a no-op then rather
    # than a false alarm, and starts checking from the first `v*` tag onwards.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Find the latest release tag
        id: baseline
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No release tag yet, so there is no published API to protect."
          else
            echo "Comparing against $tag"
          fi

      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.tag != ''
        run: cargo install cargo-semver-checks --locked

      - name: Check the public API against the last release
        if: steps.baseline.outputs.tag != ''
        run: cargo semver-checks check-release --baseline-rev ${{ steps.baseline.outputs.tag }}

  coverage:
    runs-on: ubuntu-latest
    # A signal, not a gate. The number is published so it can be watched, and
    # the job stays green whatever it says: a threshold picked before the figure
    # is known would only teach people to ignore it. Tightening this into a real
    # gate is N6-b's second half, once the floor is defensible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain with the coverage runtime
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # font-kit needs fontconfig headers to build its sys crate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure line coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Summarize into the run page
        run: cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
