[package]
name = "steleofd-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rasterise a display list to pixels"

[dependencies]
steleofd-common.workspace = true
steleofd-error.workspace = true
steleofd-geometry.workspace = true
steleofd-font.workspace = true
steleofd-display.workspace = true
steleofd-io.workspace = true
tiny-skia.workspace = true
image.workspace = true
tracing.workspace = true

[features]
default = ["backend-raster"]
# The raster backend is the one that exists. A command-stream backend for
# browsers is planned; it lands as its own feature when it lands, not before.
backend-raster   = []
