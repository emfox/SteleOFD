[package]
name = "steleofd-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-pattern editing of an OFD document with an undo stack"

# Editing applies undoable changes through the command pattern,
# produces a new package, and persists it through the package layer.
[dependencies]
steleofd-common.workspace = true
steleofd-error.workspace = true
steleofd-model.workspace = true
steleofd-package.workspace = true
steleofd-parser.workspace = true
steleofd-geometry.workspace = true
tracing.workspace = true

[dev-dependencies]
# The round-trip test asserts on what a reader reports, not on the model the
# command touched, so it opens the archive back through the facade.
steleofd-core = { workspace = true, features = ["render"] }
steleofd-display.workspace = true
# Fixture documents whose page files a test can replace.
steleofd-testkit.workspace = true
