[package]
name = "steleofd-reader"
description = "Native desktop reader for OFD documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "steleofd-reader"
path = "src/main.rs"

[lib]
name = "steleofd_reader"
path = "src/lib.rs"

[dependencies]
steleofd-core = { workspace = true, features = ["render", "search"] }
steleofd-i18n.workspace = true
steleofd-error.workspace = true
steleofd-render.workspace = true
egui.workspace = true
eframe.workspace = true
rfd = "0.17"
image.workspace = true

[dev-dependencies]
egui.workspace = true
# Drives the real widget tree without a display, which is how the window's
# layout is proven in CI rather than only in the state machine below it.
egui_kittest = { version = "0.35", features = ["eframe"] }
# Layout has nothing to arrange in a one-page document, so the arrangement
# tests need a fixture with several pages.
steleofd-testkit.workspace = true
