[package]
name = "steleofd-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
steleofd-common.workspace = true
steleofd-error.workspace = true
steleofd-geometry.workspace = true
ttf-parser.workspace = true
rustybuzz.workspace = true
serde.workspace = true
tracing.workspace = true

# font-kit needs a native fontconfig/dwrite/coretext toolchain, none of which
# exists for wasm32; browsers resolve fonts themselves, so the crate degrades.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
font-kit = { version = "0.13", optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["system-fonts"]
system-fonts = ["dep:font-kit"]
