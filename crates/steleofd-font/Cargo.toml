[package]
name = "steleofd-font"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
steleofd-common.workspace = true
steleofd-error.workspace = true
steleofd-geometry.workspace = true
ttf-parser.workspace = true
rustybuzz.workspace = true
serde.workspace = true
tracing.workspace = true

# font-kit binds the host's own font stack. Android has none of them, and wasm32
# resolves its fonts in the browser, so the crate degrades on both and the
# caller supplies faces instead.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
font-kit = { version = "0.13", optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["system-fonts"]
system-fonts = ["dep:font-kit"]
