[package]
name = "steleofd-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
steleofd-core = { workspace = true, features = ["render", "sign", "convert", "search"] }
steleofd-error.workspace = true
steleofd-font.workspace = true
steleofd-render.workspace = true
steleofd-search.workspace = true
steleofd-sign.workspace = true
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]

[dev-dependencies]
steleofd-core.workspace = true
steleofd-crypto.workspace = true
steleofd-package.workspace = true
steleofd-search.workspace = true
steleofd-sign.workspace = true
