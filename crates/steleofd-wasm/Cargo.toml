[package]
name = "steleofd-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
steleofd-core = { workspace = true, features = ["render", "sign", "convert", "search"] }
steleofd-error.workspace = true
steleofd-font.workspace = true
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

# `wasm-opt` is not run: the binaryen release it downloads rejects the
# reference types `wasm-bindgen` now emits, and the build fails on input it
# could not have produced. The Rust release profile is what sizes this out.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
steleofd-testkit.workspace = true
