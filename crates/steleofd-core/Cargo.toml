[package]
name = "steleofd-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Facade crate: the only public surface, so internals can be refactored freely.
[dependencies]
steleofd-common.workspace = true
steleofd-error.workspace = true
steleofd-io.workspace = true
steleofd-model.workspace = true
steleofd-package.workspace = true
steleofd-geometry.workspace = true
steleofd-font.workspace = true
steleofd-display.workspace = true
steleofd-parser.workspace = true
steleofd-render = { workspace = true, optional = true }
steleofd-crypto = { workspace = true, optional = true }
steleofd-sign = { workspace = true, optional = true }
steleofd-convert = { workspace = true, optional = true }
steleofd-edit = { workspace = true, optional = true }
steleofd-search = { workspace = true, optional = true }
steleofd-archive = { workspace = true, optional = true }
steleofd-print = { workspace = true, optional = true }
tracing.workspace = true
rayon = { version = "1.11", optional = true }

[features]
default = ["render", "sign", "convert", "pdf"]

# Capability features, to trim binary size per delivery form.
render   = ["dep:steleofd-render", "steleofd-render/backend-raster"]
print    = ["dep:steleofd-print"]
sign     = ["dep:steleofd-sign", "dep:steleofd-crypto"]
# Convert pulls in the raster backend anyway (PNG output goes through it),
# so naming the dependency here costs no extra compilation.
convert  = ["dep:steleofd-convert", "dep:steleofd-render"]
pdf      = ["convert", "steleofd-convert/pdf"]
# Not implemented yet; they forward to convert's placeholder features and
# change nothing. Kept so the capability has a name. See roadmap M6.
office   = ["convert", "steleofd-convert/office"]
ocr      = ["convert", "steleofd-convert/ocr"]
edit     = ["dep:steleofd-edit"]
search   = ["dep:steleofd-search"]
archive  = ["dep:steleofd-archive"]
# Annotations are read through the parser, which is never optional, so this
# feature only names the capability: it trims nothing at compile time.
annot    = []
async    = ["dep:rayon"]
