[package]
name = "steleofd-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Write a display list as SVG, PDF or PNG"

# Conversion reads one display list and writes another format,
# so it depends on display plus the relevant format readers and writers.
[dependencies]
steleofd-common.workspace = true
steleofd-error.workspace = true
steleofd-model.workspace = true
steleofd-display.workspace = true
steleofd-io.workspace = true
steleofd-geometry.workspace = true
steleofd-font.workspace = true
steleofd-parser.workspace = true
steleofd-render.workspace = true
image.workspace = true
tracing.workspace = true
lopdf = { workspace = true, optional = true }

[features]
default = ["pdf"]
pdf     = ["dep:lopdf"]
# Declared so the intent is visible, but nothing consumes them yet: enabling
# either compiles and changes nothing. Office interop is M6 in the roadmap.
office  = []
ocr     = []

[dev-dependencies]
criterion.workspace = true
steleofd-core.workspace = true
steleofd-testkit = { path = "../steleofd-testkit" }

[[bench]]
name = "convert"
harness = false
