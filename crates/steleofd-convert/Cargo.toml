[package]
name = "steleofd-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Write a display list as SVG, PDF or PNG"

# Conversion reads one display list and writes another format,
# so it depends on display plus the relevant format readers and writers.
[dependencies]
steleofd-common.workspace = true
steleofd-error.workspace = true
steleofd-display.workspace = true
steleofd-io.workspace = true
steleofd-geometry.workspace = true
steleofd-font.workspace = true
steleofd-render.workspace = true
image.workspace = true
tracing.workspace = true
lopdf = { workspace = true, optional = true }

[features]
default = ["pdf"]
pdf     = ["dep:lopdf"]
# No `office` or `ocr` feature: one that compiles and does nothing reads as a
# capability this crate has. Enabling either now fails the build, which is the
# honest answer. `docs/Roadmap.md` carries the intent.

[dev-dependencies]
criterion.workspace = true
steleofd-core.workspace = true
steleofd-testkit.workspace = true

[[bench]]
name = "convert"
harness = false

[package.metadata.cargo-semver-checks.lints]
workspace = true
