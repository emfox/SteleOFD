[package]
name = "steleofd-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The rlib is what the tests link; cdylib and staticlib are the shipping
# forms for host applications.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
steleofd-core = { workspace = true, features = ["sign", "convert", "search", "pdf"] }
steleofd-error.workspace = true
steleofd-font.workspace = true
steleofd-render.workspace = true
steleofd-search.workspace = true
steleofd-sign.workspace = true

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
steleofd-testkit.workspace = true
