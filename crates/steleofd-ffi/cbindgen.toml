# cbindgen reads the Rust bindings and writes the C header. The generated file
# is committed at include/steleofd.h and refreshed by build.rs whenever the
# bindings change; edit the Rust source, never the header.

language = "C"
pragma_once = true
documentation = true
usize_is_size_t = true
line_length = 100
tab_width = 4
style = "Both"
include_version = false
autogen_warning = "/* Generated by cbindgen from the steleofd-ffi Rust crate. Edit crates/steleofd-ffi/src, not this file. */"
after_includes = """
/*
 * Conventions:
 * - A fallible call returns (size_t)-1 and writes a NUL-terminated message
 *   into err_buf (snprintf semantics; err_buf may be NULL to drop it).
 * - Every pointer this library returns is borrowed from the handle: it stays
 *   valid until the next call on the same handle that returns borrowed data,
 *   or until steleofd_close. Copy what you need to keep.
 * - Every handle-taking call tolerates a null handle: it reports the error
 *   above, or returns zero where the call has no error channel.
 */
"""
